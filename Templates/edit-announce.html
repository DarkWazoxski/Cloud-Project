<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit</title>
    <link rel="stylesheet" href="../static/css/styles2.css">
    <link rel="stylesheet" href="../static/css/edit_announcess.css">
</head>
<body>
    
  <section class="annonces-gestion">
    <main class="container wrap">
  <div class="layout" >
    <section class="panel" aria-labelledby="form-title">
      <h2 id="form-title">modifier l'annonce</h2>
      <form id="form" method="POST" action="{{url_for('edit_news', news_id=news.id )}}" enctype="multipart/form-data">
        <label for="f-title">Titre</label>
        <input name ="title" type="text" id="f-title" maxlength="120" value="{{news.title}}">

        <label for="f-body">Contenu</label>
        <textarea name="content" id="f-body" >{{news.content}}</textarea>

        <label for="f-date">Date</label>
        <input name="date" type="date" id="f-date" value="{{news.date.strftime('%Y-%m-%d')}}">

        <label for="f-file">Image de l'annonce</label>
<img src="{{ url_for('static', filename='uploads/' + news.image) }}"
     width="150">

<input name="image" type="file" id="f-file" value="mlor">

        <div class="actions">
          <a href="{{url_for('admin_announces', username=username)}}">
            <button type="button" class="secondary">Annuler</button>
          </a>
          <button type="submit" class="primary" id="f-save">Appliquer</button>
        </div>
      </form>
    </section>
  </div>
  </main>
  </section>

</body>
</html>
