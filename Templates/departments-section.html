{% extends "base.html" %}


{% block content %}
<!-- ===== Section départements : HTML ===== -->
<section class="departments" aria-labelledby="departments-title">

  <div class="departments__inner">
    <h2 id="departments-title">Nos départements</h2>
    <p class="departments__intro">Choisissez votre département pour accéder à ses cours en ligne.</p>

    <ul class="departments__grid">
      {% for department in departments %}
        <li class="dept"><a href="{{ department.department_link }}" target="_blank"><h3>{{ department.department_name }}</h3><span>{{ department.department_description }}</span></a></li>
      {% endfor %}
    </ul>
  </div>
</section>
{% endblock %}
