<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administration : annonces</title>
<link rel="stylesheet" href="../static/css/styles.css">
</head>
<body>
<h1>Welcome {{username}}</h1>
<a href="{{ url_for('logout') }}">
  <button type="button" >Déconnexion</button>
</a>
<main class="wrap">
  <h1>Gestion des annonces</h1>
  <p class="sub">Ajoutez, modifiez ou supprimez les annonces affichées sur la page d'accueil.</p>

  <div class="layout" >
    <section class="panel" aria-labelledby="form-title">
      <h2 id="form-title">Nouvelle annonce</h2>
      <form id="form" method="POST" action="{{url_for('admin_announces', username=username )}}" enctype="multipart/form-data">
        <label for="f-title">Titre</label>
        <input name ="title" type="text" id="f-title" maxlength="120">

        <label for="f-body">Contenu</label>
        <textarea name="content" id="f-body"></textarea>

        <label for="f-date">Date</label>
        <input name="date" type="date" id="f-date">

        <label for="f-file">Image de l'annonce</label>
        <input name="image" class="form-control" type="file" id="f-file">

        <label class="check"><input name="important" type="checkbox" id="f-important"> Annonce importante</label>

        <div class="actions">
          <a href="{{ url_for('home') }}">
            <button type="button" class="secondary">Retour à l'accueil</button>
          </a>
          <a href="{{ url_for('admin_announces', username=username) }}">
          <button type="submit" class="primary" id="f-save">Publier</button>
          </a>
          <button type="button" id="f-cancel" hidden>Annuler</button>
        </div>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </form>
    </section>
  </div>
</main>



</body>
</html>
